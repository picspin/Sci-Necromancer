<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Figure planning contract harness</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 1rem;
        background: #111c2e;
        color: #e2e8f0;
        font:
          16px system-ui,
          sans-serif;
      }
      main {
        max-width: 1100px;
        margin: auto;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
      }
      section {
        min-width: 0;
        border: 1px solid #475569;
        padding: 1rem;
        border-radius: 0.5rem;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin: 0.75rem 0;
      }
      label.check {
        flex-direction: row;
        align-items: flex-start;
      }
      button,
      select,
      textarea {
        font: inherit;
        color: inherit;
        background: #0f172a;
        border: 1px solid #64748b;
        border-radius: 0.25rem;
        padding: 0.5rem;
        max-width: 100%;
        min-width: 0;
      }
      button {
        cursor: pointer;
        margin: 0.25rem 0;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      textarea {
        resize: vertical;
        width: 100%;
      }
      :focus-visible {
        outline: 2px solid #2dd4bf;
        outline-offset: 2px;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-size: 0.75rem;
      }
      img {
        display: block;
        max-width: 100%;
        background: white;
      }
      @media (max-width: 767px) {
        .grid {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./page.ts"></script>
  </body>
</html>
